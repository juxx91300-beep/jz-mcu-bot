name: JZ MCU - Verification des videos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer le bot JZ MCU
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python jzmcu_bot.py

      - name: Sauvegarder l'etat (state.json) si des videos ont ete postees
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "jz-mcu-bot"
            git config user.email "jz-mcu-bot@users.noreply.github.com"
            git add state.json
            git commit -m "JZ MCU: mise a jour des dernieres videos vues"
            git push
          else
            echo "Aucun changement a committer."
          fi
